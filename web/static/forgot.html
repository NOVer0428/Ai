<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 재설정 · 블루프린트</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <noscript><div class="noscript">이 사이트는 자바스크립트가 필요해요.<br>브라우저 설정에서 자바스크립트를 켠 뒤 새로고침해 주세요.</div><style>body > *:not(noscript) { display: none !important; }</style></noscript>
  <main class="wrap">
    <form class="panel auth" id="form">
      <h1>비밀번호 재설정</h1>
      <p class="hint">가입할 때 쓴 이메일을 입력하면 재설정 코드를 보내 드려요.</p>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="email" required maxlength="254">
      <button class="btn primary" type="submit">재설정 코드 받기</button>
      <p class="hint" style="margin-top:12px"><a href="/login">로그인으로 돌아가기</a></p>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main>
  <script src="/app.js"></script>
  <script src="/page-forgot.js"></script>
</body>
</html>
