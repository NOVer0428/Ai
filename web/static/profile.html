<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 프로필 · 블루프린트</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap" id="main" style="padding-top:36px"></main>
  <script src="/app.js"></script>
  <script>
    (async () => {
      const user = await App.header("profile");
      if (!App.requireLogin(user)) return;
      const main = document.getElementById("main");
      const date = (s) => new Date(s * 1000).toLocaleDateString("ko-KR");

      async function render() {
        const p = await App.api("/api/profile");
        const badge = p.isAdmin ? `<span class="badge admin">관리자</span>` : p.role === "sub_admin" ? `<span class="badge admin">부 관리자</span>`
          : p.emailVerified ? `<span class="badge ok">이메일 인증됨</span>` : "";
        main.innerHTML = `
          <section class="panel profile-head">
            ${p.avatar
              ? `<img class="avatar" src="${App.esc(p.avatar)}" alt="${App.esc(p.username)} 프로필 사진">`
              : `<div class="avatar" aria-hidden="true">${App.esc(p.username.slice(0, 1).toUpperCase())}</div>`}
            <div style="flex:1 1 280px;min-width:0">
              <div class="avatar-actions">
                <label class="btn ghost avatar-btn">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>사진 변경
                  <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/gif,image/webp" class="sr">
                </label>
                ${p.avatar ? `<button type="button" class="btn ghost avatar-btn muted" id="avatarDel">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>사진 삭제</button>` : ""}
              </div>
              <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1>${App.esc(p.username)}</h1>${badge}</div>
              <p class="hint" style="margin:6px 0 0">${p.email ? App.esc(p.email) + " · " : ""}${date(p.createdAt)} 가입</p>
            </div>
            <button class="btn ghost" id="pwBtn">비밀번호 변경</button>
          </section>
          <form class="panel" id="pwForm" hidden style="margin-bottom:20px;max-width:420px">
            <h2>비밀번호 변경</h2>
            <label for="cur">지금 비밀번호</label><input id="cur" type="password" autocomplete="current-password" required>
            <label for="new1">새 비밀번호</label><input id="new1" type="password" autocomplete="new-password" required minlength="8">
            <button class="btn primary" type="submit" style="margin-top:14px">바꾸기</button>
            <div class="error" id="pwErr"></div>
          </form>
          <section class="stats" aria-label="요약">
            <div class="panel"><span class="hint">보관함</span><b>${p.stats.library}</b></div>
            <div class="panel"><span class="hint">내가 올린 템플릿</span><b>${p.stats.uploads}</b></div>
            <div class="panel"><span class="hint">받은 담기</span><b>${p.stats.savesReceived}</b></div>
          </section>
          ${p.isAdmin
            // 관리자 계정은 사이트·템플릿·회원 관리 전용이라 서버 연동 칸 대신 관리 바로가기를 보여 준다
            ? `<section class="panel" style="margin-bottom:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-color:var(--line)">
                 <div style="flex:1 1 280px"><h2>사이트 관리</h2>
                   <p class="hint" style="margin:6px 0 0">관리자 계정은 회원·템플릿 관리 전용이라 서버 연동이 필요 없어요.</p></div>
                 <a class="btn primary" href="/admin">회원 관리</a>
                 <a class="btn ghost" href="/admin#templates">템플릿 관리</a>
               </section>`
            : `<div id="serverPanels"></div>`}
          <h2 style="margin:28px 0 12px">내가 올린 템플릿</h2>
          <div class="grid" id="uploads"></div>`;
        const grid = main.querySelector("#uploads");
        grid.innerHTML = p.uploads.length
          ? p.uploads.map((t) => App.cardHTML(t).replace('<span class="tag">',
              t.active ? '<span class="tag">' : '<span class="tag" title="관리자가 비활성화해서 다른 사람에게 보이지 않아요">비활성 · ')).join("")
          : `<div class="empty">아직 올린 템플릿이 없어요. <a href="/upload">업로드하기 →</a></div>`;
        App.observePreviews(grid);
        App.bindSaveButtons(grid, user, render);
        main.querySelector("#avatarFile").onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          if (file.size > 5 * 1024 * 1024) return App.toast("5MB 이하의 이미지를 올려 주세요.");
          const image = await new Promise((ok, fail) => {
            const r = new FileReader();
            r.onload = () => ok(r.result);
            r.onerror = fail;
            r.readAsDataURL(file);
          });
          try {
            await App.api("/api/profile/avatar", { method: "POST", body: { image } });
            App.toast("프로필 사진을 바꿨어요.");
            location.reload();  // 머리글 사진까지 새로 그린다
          } catch (err) {
            App.toast(err.message);
          }
        };
        main.querySelector("#avatarDel")?.addEventListener("click", async () => {
          if (!confirm("프로필 사진을 삭제할까요?")) return;
          await App.api("/api/profile/avatar", { method: "DELETE" });
          location.reload();
        });
        const form = main.querySelector("#pwForm");
        App.passwordToggles(form);
        // 서버 연동 / 내 서버 목록 (관리자는 위에서 사이트 관리 칸만 보여 준다)
        const panels = main.querySelector("#serverPanels");
        if (panels) App.serverPanels(panels);
        main.querySelector("#pwBtn").onclick = () => { form.hidden = !form.hidden; };
        form.onsubmit = async (e) => {
          e.preventDefault();
          try {
            await App.api("/api/auth/password", { method: "POST", body: {
              current: form.querySelector("#cur").value, new: form.querySelector("#new1").value } });
            form.hidden = true;
            form.reset();
            App.toast("비밀번호를 바꿨어요.");
          } catch (err) {
            form.querySelector("#pwErr").textContent = err.message;
          }
        };
      }
      render();
    })();
  </script>
</body>
</html>
