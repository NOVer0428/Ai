<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 블루프린트</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <noscript><div class="noscript">이 사이트는 자바스크립트가 필요해요.<br>브라우저 설정에서 자바스크립트를 켠 뒤 새로고침해 주세요.</div><style>body > *:not(noscript) { display: none !important; }</style></noscript>
  <main class="wrap">
    <form class="panel auth" id="form">
      <h1>로그인</h1>
      <p class="hint">계정이 없나요? <a href="/register">회원가입</a></p>
      <label for="username">아이디</label>
      <input id="username" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <label style="display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer">
        <input id="remember" type="checkbox" style="width:18px;height:18px;margin:0">로그인 상태 유지
      </label>
      <div class="hint">30일 동안 다시 로그인하지 않아도 돼요. 여러 사람이 쓰는 컴퓨터에서는 끄세요.</div>
      <button class="btn primary" type="submit">로그인</button>
      <p class="hint" style="margin-top:12px"><a href="/forgot">비밀번호를 잊으셨나요?</a></p>
      <div class="error" id="error"></div>
    </form>
  </main>
  <script src="/app.js"></script>
  <script>
    App.header();
    // 같은 사이트 주소로만 이동 (/\evil.com 같은 우회 차단)
    const safeNext = (() => {
      try {
        const u = new URL(new URLSearchParams(location.search).get("next") || "/", location.origin);
        return u.origin === location.origin ? u.href : "/";  // 경로만 다시 쓰면 //외부주소 로 빠져나갈 수 있어 전체 주소를 쓴다
      } catch { return "/"; }
    })();
    if (new URLSearchParams(location.search).get("verify") === "invalid") {
      document.getElementById("error").textContent =
        "인증 링크가 잘못됐거나 만료됐어요. 로그인하면 인증 메일을 다시 보내 드려요.";
    }
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await App.api("/api/auth/login", { method: "POST", body: {
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
          remember: document.getElementById("remember").checked,
        }});
        location.href = safeNext;
      } catch (err) {
        if (err.data?.needsVerify) {
          App.verifyForm(document.getElementById("form"), { username: err.data.username, email: err.data.email,
            password: document.getElementById("password").value, notice: err.message });
          return;
        }
        document.getElementById("error").textContent = err.message;
      }
    };
  </script>
</body>
</html>
