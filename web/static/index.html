<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블루프린트 · 건물 템플릿</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <noscript><div class="noscript">이 사이트는 자바스크립트가 필요해요.<br>브라우저 설정에서 자바스크립트를 켠 뒤 새로고침해 주세요.</div><style>body > *:not(noscript) { display: none !important; }</style></noscript>
  <main class="wrap">
    <section class="hero">
      <div>
        <h1>고르고, 담고,<br><em>인게임에서 바로 짓기.</em></h1>
        <p>마음에 드는 건물 템플릿을 보관함에 담아두면 마인크래프트 서버에서 명령어 한 줄로 자동 건축됩니다.</p>
      </div>
      <ol class="steps">
        <li><b>01</b>회원가입 후 템플릿을 보관함에 담기</li>
        <li><b>02</b>내 보관함에서 연동 코드 발급 → 인게임 <code>/tb link 코드</code></li>
        <li><b>03</b><code>/tb list</code> 로 확인, <code>/tb build 1</code> 로 건축</li>
      </ol>
    </section>

    <div class="toolbar">
      <input id="q" type="search" placeholder="템플릿 이름이나 설명으로 검색">
      <select id="sort"><option value="new">최신순</option><option value="popular">인기순</option></select>
    </div>
    <div class="chips" id="cats"></div>
    <div class="grid" id="grid"></div>
  </main>

  <script src="/app.js"></script>
  <script>
    (async () => {
      const user = await App.header("home");
      const grid = document.getElementById("grid");
      const q = document.getElementById("q");
      const sort = document.getElementById("sort");
      const cats = document.getElementById("cats");
      let category = "";

      async function load() {
        const params = new URLSearchParams({ q: q.value, sort: sort.value, category });
        const { templates, categories } = await App.api(`/api/templates?${params}`);
        cats.innerHTML = ["", ...categories].map((c) =>
          `<button class="chip ${c === category ? "on" : ""}" data-cat="${App.esc(c)}">${c ? App.esc(c) : "전체"}</button>`).join("");
        grid.innerHTML = templates.length
          ? templates.map((t) => App.cardHTML(t)).join("")
          : `<div class="empty">조건에 맞는 템플릿이 없습니다.</div>`;
        App.observePreviews(grid);
      }

      cats.onclick = (e) => {
        const b = e.target.closest("[data-cat]");
        if (b) { category = b.dataset.cat; load(); }
      };
      let t;
      q.oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
      sort.onchange = load;
      App.bindSaveButtons(grid, user, (id, saved, btn) => {
        btn.outerHTML = App.saveButton({ id, saved });
      });
      load();
    })();
  </script>
</body>
</html>
