<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · 블루프린트</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <form class="panel auth" id="form">
      <h1>회원가입</h1>
      <p class="hint">이미 계정이 있나요? <a href="/login">로그인</a></p>
      <label for="username">아이디</label>
      <input id="username" autocomplete="username" required minlength="3" maxlength="20">
      <div class="hint">3~20자, 영문·숫자·한글·_</div>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="new-password" required minlength="8">
      <label for="password2">비밀번호 확인</label>
      <input id="password2" type="password" autocomplete="new-password" required minlength="8">
      <button class="btn primary" type="submit">가입하기</button>
      <div class="error" id="error"></div>
    </form>
  </main>
  <script src="/app.js"></script>
  <script>
    App.header();
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const error = document.getElementById("error");
      const password = document.getElementById("password").value;
      if (password !== document.getElementById("password2").value) {
        error.textContent = "비밀번호가 서로 다릅니다.";
        return;
      }
      try {
        await App.api("/api/auth/register", { method: "POST", body: {
          username: document.getElementById("username").value, password,
        }});
        location.href = "/library";
      } catch (err) {
        error.textContent = err.message;
      }
    };
  </script>
</body>
</html>
