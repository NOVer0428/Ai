<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · 블루프린트</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <noscript><div class="noscript">이 사이트는 자바스크립트가 필요해요.<br>브라우저 설정에서 자바스크립트를 켠 뒤 새로고침해 주세요.</div><style>body > *:not(noscript) { display: none !important; }</style></noscript>
  <main class="wrap">
    <form class="panel auth" id="form">
      <h1>회원가입</h1>
      <p class="hint">이미 계정이 있나요? <a href="/login">로그인</a></p>
      <label for="username">아이디</label>
      <input id="username" autocomplete="username" required minlength="6" maxlength="15">
      <div class="hint">6~15자, 영문·숫자·한글·_</div>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="email" required maxlength="254">
      <div class="hint">가입을 마치려면 이 주소로 오는 6자리 인증 코드를 입력해야 해요.</div>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="15">
      <div class="hint">8~15자 · 숫자, 영어 소문자, 영어 대문자, 특수문자(! ? / \ | @ # $ % ^ &amp; *)를 모두 넣어 주세요 · 아이디와 같거나 비슷하면 안 돼요</div>
      <label for="password2">비밀번호 확인</label>
      <input id="password2" type="password" autocomplete="new-password" required minlength="8" maxlength="15">
      <fieldset class="agree">
        <legend class="sr">약관 동의</legend>
        <label class="agree-all"><input type="checkbox" id="agreeAll"> 전체 동의</label>
        <label><input type="checkbox" id="agreeTerms" required> <span>[필수] 이용약관 동의</span>
          <a href="/terms#service" target="_blank" rel="noopener">보기</a></label>
        <label><input type="checkbox" id="agreePrivacy" required> <span>[필수] 개인정보 수집·이용 동의</span>
          <a href="/terms#privacy" target="_blank" rel="noopener">보기</a></label>
        <label><input type="checkbox" id="agreeAge" required> <span>[필수] 만 14세 이상입니다</span></label>
        <p class="hint">수집 항목: 아이디, 이메일, 비밀번호(암호화) · 목적: 회원 관리·인증 · 보유: 탈퇴할 때까지. 동의하지 않으면 가입할 수 없어요. 만 14세 미만은 가입할 수 없어요. <a href="/privacy" target="_blank" rel="noopener">개인정보 처리방침</a></p>
      </fieldset>
      <button class="btn primary" type="submit">가입하기</button>
      <div class="error" id="error"></div>
    </form>
  </main>
  <script src="/app.js"></script>
  <script>
    App.header();
    // 전체 동의 ↔ 개별 동의 체크 맞추기
    const agreeAll = document.getElementById("agreeAll");
    const agreeEach = ["agreeTerms", "agreePrivacy", "agreeAge"].map((id) => document.getElementById(id));
    agreeAll.onchange = () => agreeEach.forEach((c) => { c.checked = agreeAll.checked; });
    agreeEach.forEach((c) => c.onchange = () => { agreeAll.checked = agreeEach.every((x) => x.checked); });
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const error = document.getElementById("error");
      const password = document.getElementById("password").value;
      if (password !== document.getElementById("password2").value) {
        error.textContent = "비밀번호가 서로 다릅니다.";
        return;
      }
      try {
        const r = await App.api("/api/auth/register", { method: "POST", body: {
          username: document.getElementById("username").value,
          email: document.getElementById("email").value, password,
          agreeTerms: document.getElementById("agreeTerms").checked,
          agreePrivacy: document.getElementById("agreePrivacy").checked,
          agreeAge: document.getElementById("agreeAge").checked,
        }});
        App.verifyForm(document.getElementById("form"),
          { username: document.getElementById("username").value.trim(), email: r.email, password });
      } catch (err) {
        error.textContent = err.message;
      }
    };
  </script>
</body>
</html>
