name: BlueprintBuilder
version: '${version}'
main: dev.blueprint.builder.BlueprintPlugin
api-version: '26.3'
description: 웹사이트 보관함의 건물 템플릿을 불러와 자동 건축합니다.
commands:
  tb:
    description: 블루프린트 건물 템플릿 명령어
    usage: /tb help
    aliases: [blueprint]
permissions:
  blueprint.use:
    description: 계정 연동, 목록 조회, 건축
    default: true
  blueprint.save:
    description: 인게임 영역을 템플릿으로 업로드
    default: true
  blueprint.admin:
    description: 설정 리로드
    default: op
